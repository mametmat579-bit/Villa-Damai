<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa Damai - Cek-in</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2a24;--mut:#6b756f;--bd:#e2ded4;--ac:#2f6b4f;--g:#1f9d55;--gb:#e3f6ea;--r:#d64545;--rb:#fdeaea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--card:#1e2426;--tx:#eceee9;--mut:#9aa5a0;--bd:#2f393a;--ac:#5dbb8a;--g:#3ecf80;--gb:#183324;--r:#ef6b6b;--rb:#3a1d1d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.d{color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center;font-size:.75rem;color:var(--mut);padding:4px 0}
.day{aspect-ratio:1;border:1px solid var(--bd);border-radius:10px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:var(--bg);font-size:.9rem;cursor:pointer}
.day.today{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.day.empty{border:none;background:none;cursor:default}
.dots{display:flex;gap:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bd)}
.dot.on{background:var(--g)}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;max-height:85%;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:1.1rem}
.room{border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.room.on{background:var(--gb);border:1px solid var(--g)}
.room.off{background:var(--rb);border:1px solid var(--r)}
.room small{display:block;color:var(--mut)}
.leg{display:flex;gap:14px;font-size:.8rem;color:var(--mut);margin-top:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.li small{display:block;color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Villa Damai</h1>
  <p class="sub">Cek-in tamu dan monitoring kamar 1 sampai 4</p>
  <p id="st" class="sub" style="margin-top:-8px"></p>

  <div class="card">
    <div class="nav"><button id="prev">&larr;</button><b id="ttl"></b><button id="next">&rarr;</button></div>
    <div class="grid" id="cal"></div>
    <div class="leg"><span><i style="background:var(--g)"></i>Ada tamu</span><span><i style="background:var(--r)"></i>Kosong</span></div>
  </div>

  <div class="card">
    <b>Tandai cek-in</b>
    <label for="nm">Nama tamu</label><input id="nm" placeholder="Nama tamu">
    <label for="rm">Kamar</label>
    <select id="rm"><option>1</option><option>2</option><option>3</option><option>4</option></select>
    <div class="row2">
      <div><label for="ci">Tanggal cek-in</label><input type="date" id="ci"></div>
      <div><label for="co">Tanggal cek-out</label><input type="date" id="co"></div>
    </div>
    <p id="msg" class="sub" style="margin:10px 0 0"></p>
    <button class="p" id="save" style="width:100%;margin-top:10px">Simpan cek-in</button>
  </div>

  <div class="card"><b>Daftar cek-in</b><div id="lst"></div></div>

  <div class="card">
    <b>Rekap 3 bulan</b>
    <div class="row2">
      <div><label for="qs">Periode</label><select id="qs"><option value="0">Jan - Mar</option><option value="3">Apr - Jun</option><option value="6">Jul - Sep</option><option value="9">Okt - Des</option></select></div>
      <div><label for="qy">Tahun</label><input type="number" id="qy"></div>
    </div>
    <div id="rc" style="margin-top:12px;overflow-x:auto"></div>
    <p id="xm" class="sub" style="margin:10px 0 0"></p>
    <button class="p" id="xl" style="width:100%;margin-top:10px">Unduh Excel</button>
  </div>
</main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="ov show" id="lg" style="align-items:center"><div class="sheet" style="border-radius:18px;max-width:340px">
  <h2>Masuk</h2>
  <label for="pin">PIN</label><input type="password" id="pin" autocomplete="current-password">
  <p id="lgm" class="sub" style="color:var(--r);margin:8px 0 0"></p>
  <button class="p" id="lgb" style="width:100%;margin-top:10px">Masuk</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  // GANTI dengan alamat Web App dari Google Apps Script Anda (berakhiran /exec)
  var API="https://script.google.com/macros/s/AKfycbwu8h8eND4ryAsdCF6RicgdvEcBOyo3CR-5Yog5zlMSeOxuB3y5zsu0IzwWIyWKVf5pvg/exec";
  var PK="villa-damai-pin", bk=[], cur=new Date(), pin="";
  cur.setDate(1);
  try{ pin=localStorage.getItem(PK)||""; }catch(e){}
  var $=function(id){return document.getElementById(id);};
  var BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  function ds(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function at(room,d){ return bk.find(function(b){ return b.room===room && b.ci<=d && d<b.co; }); }
  function fmt(s){ var p=s.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function esc(t){ var d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
  function setSt(t,err){ $("st").textContent=t; $("st").style.color=err?"var(--r)":"var(--mut)"; }

  function api(body){
    if(!body) return fetch(API+"?pin="+encodeURIComponent(pin)).then(function(r){return r.json();});
    body.pin=pin;
    return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json();});
  }
  function login(msg){ $("lgm").textContent=msg||""; $("lg").classList.add("show"); }
  function load(){
    if(!pin) return login();
    api().then(function(r){
      if(!r.ok){ if(r.error==="pin"){ pin=""; try{localStorage.removeItem(PK);}catch(e){} login("PIN salah."); } else setSt("Gagal memuat data",1); return; }
      bk=r.data; $("lg").classList.remove("show"); setSt("Tersambung ke Google Sheets");
      render(); if($("ov").classList.contains("show")) openDay($("ov").dataset.d);
    }).catch(function(){ setSt("Tidak bisa terhubung. Cek internet atau alamat Apps Script.",1); });
  }
  $("lgb").onclick=function(){ pin=$("pin").value.trim(); if(!pin) return; try{localStorage.setItem(PK,pin);}catch(e){} load(); };

  function render(){
    var y=cur.getFullYear(), m=cur.getMonth();
    $("ttl").textContent=BULAN[m]+" "+y;
    var h="";
    ["Min","Sen","Sel","Rab","Kam","Jum","Sab"].forEach(function(n){ h+='<div class="dh">'+n+'</div>'; });
    var first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate(), today=ds(new Date());
    for(var i=0;i<first;i++) h+='<div class="day empty"></div>';
    for(var d=1;d<=n;d++){
      var s=ds(new Date(y,m,d)), dots="";
      for(var r=1;r<=4;r++) dots+='<span class="dot'+(at(r,s)?' on':'')+'"></span>';
      h+='<div class="day'+(s===today?' today':'')+'" data-d="'+s+'"><span>'+d+'</span><span class="dots">'+dots+'</span></div>';
    }
    $("cal").innerHTML=h;
    renderList(); renderRecap();
  }
  function renderList(){
    var l=bk.slice().sort(function(a,b){return a.ci<b.ci?1:-1;});
    $("lst").innerHTML=l.length?l.map(function(b){return '<div class="li"><div><b>'+esc(b.name)+'</b> - Kamar '+b.room+'<small>'+fmt(b.ci)+' sampai '+fmt(b.co)+'</small></div><button class="d" data-del="'+b.id+'">Hapus</button></div>';}).join(""):'<p class="sub">Belum ada data cek-in.</p>';
  }
  function delBk(id,cb){
    api({action:"del",id:id}).then(function(r){
      if(r.ok){ bk=bk.filter(function(b){return b.id!==id;}); render(); if(cb) cb(); }
      else if(r.error==="pin") login("PIN salah.");
    }).catch(function(){ setSt("Gagal menghapus. Cek koneksi.",1); });
  }
  function openDay(s){
    var h='<h2>'+fmt(s)+'</h2>';
    for(var r=1;r<=4;r++){
      var b=at(r,s);
      if(b) h+='<div class="room on"><div><b>Kamar '+r+'</b><small>'+esc(b.name)+' ('+fmt(b.ci)+' - '+fmt(b.co)+')</small></div><button class="d" data-del="'+b.id+'">Hapus</button></div>';
      else h+='<div class="room off"><div><b>Kamar '+r+'</b><small>Kosong</small></div><button data-add="'+r+'" data-date="'+s+'">Cek-in</button></div>';
    }
    h+='<button id="cl" style="width:100%;margin-top:6px">Tutup</button>';
    $("sheet").innerHTML=h; $("ov").classList.add("show"); $("ov").dataset.d=s;
  }
  function close(){ $("ov").classList.remove("show"); }
  function twoStep(t,fn){
    if(!t.dataset.sure){ t.dataset.sure="1"; t.textContent="Yakin hapus?"; return; }
    fn(t.dataset.del);
  }

  $("cal").addEventListener("click",function(e){ var c=e.target.closest(".day[data-d]"); if(c) openDay(c.dataset.d); });
  $("sheet").addEventListener("click",function(e){
    var t=e.target;
    if(t.id==="cl") return close();
    if(t.dataset.del) twoStep(t,function(id){ delBk(id,function(){ openDay($("ov").dataset.d); }); });
    if(t.dataset.add){
      var nx=new Date(t.dataset.date+"T00:00:00"); nx.setDate(nx.getDate()+1);
      $("rm").value=t.dataset.add; $("ci").value=t.dataset.date; $("co").value=ds(nx);
      close(); $("nm").focus(); $("nm").scrollIntoView({behavior:"smooth",block:"center"});
    }
  });
  $("lst").addEventListener("click",function(e){ var t=e.target; if(t.dataset.del) twoStep(t,function(id){ delBk(id); }); });
  $("ov").addEventListener("click",function(e){ if(e.target===$("ov")) close(); });
  $("prev").onclick=function(){ cur.setMonth(cur.getMonth()-1); render(); };
  $("next").onclick=function(){ cur.setMonth(cur.getMonth()+1); render(); };

  var t2=new Date(); t2.setDate(t2.getDate()+1);
  $("ci").value=ds(new Date()); $("co").value=ds(t2);

  $("save").onclick=function(){
    var name=$("nm").value.trim(), room=parseInt($("rm").value,10), ci=$("ci").value, co=$("co").value, msg=$("msg");
    msg.style.color="var(--r)";
    if(!name){ msg.textContent="Isi nama tamu dulu."; return; }
    if(!ci||!co||co<=ci){ msg.textContent="Tanggal cek-out harus setelah cek-in."; return; }
    var clash=bk.find(function(b){ return b.room===room && b.ci<co && ci<b.co; });
    if(clash){ msg.textContent="Kamar "+room+" sudah terisi ("+clash.name+") pada tanggal tersebut."; return; }
    var nb={id:String(Date.now()),name:name,room:room,ci:ci,co:co,action:"add"};
    msg.style.color="var(--mut)"; msg.textContent="Menyimpan...";
    api(nb).then(function(r){
      if(r.ok){
        bk.push({id:nb.id,name:name,room:room,ci:ci,co:co});
        var p=ci.split("-"); cur=new Date(+p[0],+p[1]-1,1); render();
        $("nm").value=""; msg.style.color="var(--g)"; msg.textContent="Cek-in tersimpan: "+name+", kamar "+room+".";
      }else if(r.error==="bentrok"){ msg.style.color="var(--r)"; msg.textContent="Kamar sudah terisi pada tanggal itu (mungkin baru dicatat perangkat lain)."; load(); }
      else if(r.error==="pin") login("PIN salah.");
      else { msg.style.color="var(--r)"; msg.textContent="Gagal menyimpan."; }
    }).catch(function(){ msg.style.color="var(--r)"; msg.textContent="Gagal menyimpan. Cek koneksi."; });
  };

  function dn(s){ var p=s.split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5; }
  function ms(y,m){ return y+"-"+String(m+1).padStart(2,"0")+"-01"; }
  function nightsIn(room,y,m){
    var a=dn(ms(y,m)), z=dn(ms(m===11?y+1:y,(m+1)%12)), t=0;
    bk.forEach(function(b){ if(b.room!==room) return; var s=Math.max(a,dn(b.ci)), e=Math.min(z,dn(b.co)); if(e>s) t+=e-s; });
    return t;
  }
  function recapData(){
    var q=parseInt($("qs").value,10), y=parseInt($("qy").value,10)||new Date().getFullYear(), rows=[], i, r;
    for(r=1;r<=4;r++){ var row=["Kamar "+r], tot=0; for(i=0;i<3;i++){ var n=nightsIn(r,y,q+i); row.push(n); tot+=n; } row.push(tot); rows.push(row); }
    var head=["Kamar"]; for(i=0;i<3;i++) head.push(BULAN[q+i]+" "+y); head.push("Total malam");
    var sum=["Total"]; for(var c=1;c<5;c++){ var s=0; rows.forEach(function(x){s+=x[c];}); sum.push(s); }
    rows.push(sum);
    var a=dn(ms(y,q)), z=dn(ms(q+3>11?y+1:y,(q+3)%12));
    var guests=bk.filter(function(b){return dn(b.ci)<z && dn(b.co)>a;}).sort(function(x,w){return x.ci<w.ci?-1:1;}).map(function(b){return [b.name,"Kamar "+b.room,fmt(b.ci),fmt(b.co),dn(b.co)-dn(b.ci)];});
    return {head:head,rows:rows,guests:guests,label:BULAN[q]+" - "+BULAN[q+2]+" "+y};
  }
  function renderRecap(){
    var d=recapData();
    $("rc").innerHTML="<table><tr>"+d.head.map(function(h){return "<th>"+h+"</th>";}).join("")+"</tr>"+d.rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";}).join("")+"</table>";
  }
  $("qy").value=new Date().getFullYear();
  $("qs").value=String(Math.floor(new Date().getMonth()/3)*3);
  $("qs").onchange=renderRecap; $("qy").oninput=renderRecap;

  $("xl").onclick=function(){
    var xm=$("xm"), d=recapData();
    try{
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Villa Damai - Rekap "+d.label],[],d.head].concat(d.rows)),"Rekap");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Nama tamu","Kamar","Cek-in","Cek-out","Malam"]].concat(d.guests)),"Daftar Tamu");
      var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
      a.download="Rekap Villa Damai "+d.label+".xlsx"; document.body.appendChild(a); a.click(); a.remove();
      xm.style.color="var(--g)"; xm.textContent="File Excel diunduh.";
    }catch(e){ xm.style.color="var(--r)"; xm.textContent="Gagal membuat file Excel."; }
  };

  // sinkron otomatis dengan perangkat lain
  setInterval(function(){ if(pin && !document.hidden) load(); },20000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden && pin) load(); });
  render(); load();
})();
</script>
</body>
</html>
